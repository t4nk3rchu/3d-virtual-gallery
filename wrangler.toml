name = "reda-virtual-gallery"
main = "worker/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "reda-database"
database_id = "c0d868be-1f10-4186-bae3-841478d9019c"
migrations_dir = "migrations"

# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "gallery_events"

# [[ratelimits]]
# name = "EVENTS_LIMITER"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }

[vars]
GOOGLE_OAUTH_CLIENT_ID = "191553590412-v3b19drcb68da1ubo26ujoghnpf58qu2.apps.googleusercontent.com"

# Secrets (set via `wrangler secret put <NAME>`):
# 1. GOOGLE_OAUTH_CLIENT_SECRET
# 2. JWT_SECRET_KEY
# 3. GDRIVE_SA_CLIENT_EMAIL   (service-account client_email from the JSON key file)
# 4. GDRIVE_SA_PRIVATE_KEY    (service-account private_key PEM, incl. BEGIN/END lines)
# 5. MEDIA_SIGNING_KEY        (long random string: openssl rand -hex 32)
# APP_ORIGIN = "https://your-domain.com"  — add to [vars] if using a custom domain

